     fill="none"
     stroke="#E24B4A"
     stroke-width="1.3"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
     id="path17" />
  <!-- Step 7: p6→p7 (last small hop, nearly converged) -->
  <path
     d="M 516,185 Q 513,178 510,188"
     fill="none"
     stroke="#E24B4A"
     stroke-width="1.2"
