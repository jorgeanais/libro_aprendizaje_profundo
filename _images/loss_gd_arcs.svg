  <!-- ── Gradient descent arcs (small lr, converging to θ₂) ──
       Points sampled along the curve descending from x=565 toward x=508.
       Each arc goes from point i to point i+1, curving upward slightly
       to represent the "hop" of a gradient step.

       Curve points (x, y) on the loss path:
         p0  = (565, 127)   start (θ=15)
         p1  = (556, 140)
         p2  = (547, 153)
         p3  = (538, 163)
         p4  = (530, 171)
         p5  = (522, 179)
         p6  = (516, 185)
         p7  = (510, 188)   ≈ θ₂ (converged)

       Arc: quadratic bezier from A to B with control point lifted
       above both endpoints by ~18px (small hop = small lr).
  -->
  <!-- Step 1: p0→p1 -->
  <path
     d="M 565,127 Q 560.5,112 556,140"
     fill="none"
     stroke="#E24B4A"
     stroke-width="1.4"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
     id="path12" />
  <!-- Step 2: p1→p2 -->
  <path
     d="M 556,140 Q 551.5,126 547,153"
     fill="none"
     stroke="#E24B4A"
     stroke-width="1.4"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
     id="path13" />
  <!-- Step 3: p2→p3 -->
  <path
     d="M 547,153 Q 542.5,140 538,163"
     fill="none"
     stroke="#E24B4A"
     stroke-width="1.4"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
     id="path14" />
  <!-- Step 4: p3→p4 -->
  <path
     d="M 538,163 Q 534,151 530,171"
     fill="none"
     stroke="#E24B4A"
     stroke-width="1.4"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
     id="path15" />
  <!-- Step 5: p4→p5 -->
  <path
     d="M 530,171 Q 526,160 522,179"
     fill="none"
     stroke="#E24B4A"
     stroke-width="1.4"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
