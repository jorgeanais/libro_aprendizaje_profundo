  <!-- ══════════════════════════════════════════════════
       GRADIENT DESCENT ARCS — large learning rate
       Trajectory: θ=15 → salta θ₂ → salta θ₁ → converge θ*

       Puntos clave sobre la curva:
         A  = (565, 127)   inicio θ=15
         B  = (468, 175)   aterriza al otro lado de θ₂ (gran salto)
         C  = (370, 240)   sobrepasa θ₁ (otro gran salto)
         D  = (255, 232)   cerca de la cuenca del mínimo global
         E  = (200, 270)   descendiendo hacia θ*
         F  = (172, 305)   converge ≈ θ*

       Los arcos se curvan hacia ARRIBA (control point con y reducido)
       para simular el salto por encima del paisaje.
       El radio de curvatura es proporcional al tamaño del paso.
  ══════════════════════════════════════════════════ -->
  <!-- Step 1: A→B  gran salto, salta θ₂  (arco alto) -->
  <path
     d="M 564.89461,127.35727 Q 498.33391,59.910664 433.13159,175.67723"
     fill="none"
     stroke="#e24b4a"
     stroke-width="1.8"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
     id="path12" />
  <!-- Step 2: B→C  salta θ₁ (arco amplio) -->
  <path
     d="M 431.39805,176.03964 Q 369.4147,122.76755 307.43135,238.99756"
     fill="none"
     stroke="#e24b4a"
     stroke-width="1.99242"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
     id="path13" />
  <!-- Step 3: C→D  entra en la cuenca del mínimo global -->
  <!-- Step 4: D→E  se acerca, salto más pequeño -->
  <path
     d="m 308.35341,237.35133 q 27.44763,-23.64148 53.91501,33.27318"
     fill="none"
     stroke="#e24b4a"
     stroke-width="1.38969"
     stroke-linecap="round"
     marker-end="url(#arr-step)"
     id="path15" />
  <!-- Step 5: E→F  último pequeño arco, converge a θ* -->
  <path
     d="m 362.92346,270.18076 q -15.43335,-10.92472 -30.8667,21.24252"
     fill="none"
     stroke="#e24b4a"
     stroke-width="1.06336"
     stroke-linecap="round"
